# SonarCloud project settings for axura-engine
# Replace YOUR_ORG with your SonarCloud organization key (found at sonarcloud.io/organizations)
sonar.projectKey=YOUR_ORG_axura-engine
sonar.organization=YOUR_ORG

sonar.projectName=axura-engine
sonar.sources=.
sonar.exclusions=node_modules/**,dist/**,coverage/**,**/*.test.ts,**/*.spec.ts
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.tsconfigPath=tsconfig.json
